# Linux guest of the shared ivshmem-pci case. It is the standard-enumerator
# witness: the busybox initramfs /init (generated by axbuild) asserts the
# guest-sysfs PCI enumeration surface and prints the case marker itself.
[base]
id = 1
name = "linux-ivshmem-pci"
guest_type = "passthrough"
cpu_num = 1
phys_cpu_ids = [1]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "${workspace}/tmp/axbuild/images/qemu-aarch64/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000
ramdisk_path = "${workspace}/tmp/axbuild/axvisor/qemu-ivshmem-pci/initramfs-aarch64.cpio.gz"
ramdisk_load_addr = 0x8400_0000
# axvisor.pci_aperture must match the AArch64 auto-placed PCI memory aperture
# (the auto MMIO pool starts after the 1 MiB ECAM at 0x0b00_0000) and feeds
# the sysfs BAR2 containment check in the initramfs /init.
cmdline = "console=ttyAMA0 rdinit=/init devtmpfs.mount=1 loglevel=7 initcall_blacklist=ahci_pci_driver_init,virtio_pci_driver_init axvisor.pci_case=ivshmem-polling axvisor.pci_aperture=0x0c000000-0x10000000"
memory_regions = [
  [0x8000_0000, 0x2000_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = [
  # The generated guest DTB must not expose the host PCIe controller; the
  # virtual pci-host-ecam-generic node replaces it.
  { path = "/pcie@10000000" },
]

[[devices.virtual]]
id = "ivshmem0"
model = "ivshmem-pci"
link_id = 1
peer_id = 0
