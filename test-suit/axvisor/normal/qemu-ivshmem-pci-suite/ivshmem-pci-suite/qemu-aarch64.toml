args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-m",
  "8g",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "run VCpu\\[\\d+\\] get error",
  "IVSHMEM_SUITE_LINUX_ENUMERATION_FAILED",
  "IVSHMEM_SUITE_PORTABLE_ENUMERATION_FAILED",
  "IVSHMEM_PCI_SUITE_FAILED",
  "ARCEOS_IVSHMEM_PCI_FAIL",
]
# The primary Linux peer emits this only after its polling and MSI-X phases,
# the ArceOS exchange, and both non-target isolation checks complete.
success_regex = [
  "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?IVSHMEM_PCI_SUITE_PASSED\\s*$",
]
timeout = 240
to_bin = true
uefi = false
