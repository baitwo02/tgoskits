args = [
    "-nographic",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "root=/dev/nvme0n1 rw init=/bin/sh",
    "-m",
    "8g",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)unhandled page fault",
    "(?i)page fault",
    "ivc publish failed",
    "ivc subscribe failed",
    "ivc validation failed",
    "ivc send error",
    "ivc recv error",
    "ivc recv ack error",
]
# Both guests and Axvisor share one UART, so guest completion lines can be
# interleaved at character granularity. Match the host-side terminal marker,
# which is emitted only after both VMs stop. Every application error path emits
# one of the fail_regex strings above, so a clean host marker proves that both
# demos reached shutdown without a reported protocol or transport failure.
success_regex = ["\\[OK\\] Default guest initialized"]
to_bin = true
uefi = false
