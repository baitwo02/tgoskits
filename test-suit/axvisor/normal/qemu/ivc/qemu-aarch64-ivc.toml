args = [
    "-nographic",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "root=/dev/nvme0n1 rw init=/bin/sh",
    "-m",
    "8g",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)unhandled page fault",
    "(?i)page fault",
    "ivc publish failed",
    "ivc validation failed",
    "ivc send error",
    "ivc recv error",
    "linux ivc validation failed",
    "linux ivc send error",
    "linux ivc recv error",
    "(?m)^linux ivc demo failed\\s*$",
]
# success_regex is matched any-of and latches on the first hit, followed by a
# short drain. Both markers are emitted only after the Linux subscriber has
# validated all five ordered Request messages and published all three Data
# messages plus five application-level Acks. The publisher marker additionally
# proves Linux-specific Ack body interoperability. Concurrent console streams
# may prepend ANSI SGR resets to a completion line.
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*linux ivc demo pass\\s*$",
    "(?m)^(?:\\x1b\\[[0-9;]*m)*ivc ack seq=5 msg=ack from linux subscriber\\s*$",
]
shell_prefix = "~ #"
shell_init_cmd = '''
echo "linux ivc kernel $(uname -r)"
chmod +x /root/ivc-subscribe || true
if ! insmod /root/axvisor.ko; then
    echo 'linux ivc demo failed'
elif ! test -e /dev/axivc; then
    echo 'linux ivc demo failed'
elif ! /root/ivc-subscribe 1 0x49564301 5; then
    echo 'linux ivc demo failed'
else
    echo 'linux ivc subscriber finished'
fi
'''
to_bin = true
uefi = false
